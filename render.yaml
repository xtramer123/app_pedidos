databases:
  - name: app-pedidos-db
    plan: free

services:
  - type: web
    name: app-pedidos-api
    runtime: python
    plan: free
    rootDir: API
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL_ENV
        fromDatabase:
          name: app-pedidos-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: app-pedidos
    runtime: static
    buildCommand: git clone https://github.com/flutter/flutter.git -b stable --depth 1 && ./flutter/bin/flutter build web --release
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
